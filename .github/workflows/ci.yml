name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - name: Corpus must pass
        run: |
          set -o pipefail
          python -m pytest tests/ -q
      - name: Dogfood, deadgate must not flag its own workflow
        run: |
          set -o pipefail
          deadgate .
