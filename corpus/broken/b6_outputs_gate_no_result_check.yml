# EXPECT: D4
# If 'detect' FAILS, its outputs are unset, the condition is false, 'test' SKIPS,
# and a skipped job reports Success. The suite is silently disabled.
name: CI
on: [pull_request]
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - id: filter
        run: echo "rust=true" >> "$GITHUB_OUTPUT"
  test:
    needs: [detect]
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps: [{run: cargo test}]
