# NEAR MISS of b6: same change-detection shape, but it also requires the gating job to
# have SUCCEEDED, so a failed detect does not silently disable the tests.
name: CI
on: [pull_request]
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - id: filter
        run: echo "rust=true" >> "$GITHUB_OUTPUT"
  test:
    needs: [detect]
    if: ${{ needs.detect.result == 'success' && needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps: [{run: cargo test}]
