[project]
name = "deadgate"
version = "0.1.8"
description = "Find CI checks that cannot fail: gates satisfied by skipped jobs, exit statuses swallowed by pipes, fan-ins that never read whether their upstream passed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "contact@erikhill.dev" }]
keywords = [
    "ci", "github-actions", "workflow", "static-analysis", "testing",
    "mutation-testing", "branch-protection", "continuous-integration", "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
deadgate = "deadgate.cli:main"

[project.urls]
Homepage = "https://github.com/egnaro9/deadgate"
Repository = "https://github.com/egnaro9/deadgate"
Issues = "https://github.com/egnaro9/deadgate/issues"
"How it was measured" = "https://github.com/egnaro9/deadgate/blob/main/MEASUREMENT.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deadgate*"]
